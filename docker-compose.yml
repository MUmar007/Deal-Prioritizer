services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: deal
      POSTGRES_PASSWORD: deal
      POSTGRES_DB: dealprioritizer
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deal -d dealprioritizer"]
      interval: 2s
      timeout: 3s
      retries: 15

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"

  api:
    build: ./server
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://deal:deal@db:5432/dealprioritizer
      REDIS_URL: redis://redis:6379/0
      CACHE_SECONDS: "3600"
      HTTP_TIMEOUT: "15"
      NOMINATIM_UA: DealPrioritizer/1.0 (+https://github.com/MUmar007/Deal-Prioritizer)
      CORS_ORIGINS: '["http://localhost:3000","http://127.0.0.1:3000"]'
      GEOCODE_URL: https://nominatim.openstreetmap.org/search
      OVERPASS_URL: https://overpass-api.de/api/interpreter
      OVERPASS_RETRY_STATUS: "[429,502,503,504]"
      OVERPASS_RETRY_SECONDS: "2"
      NOMINATIM_PAUSE_SECONDS: "1"
      NOMINATIM_MAX_RESULTS: "40"
      CACHE_VERSION: v3
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')
      interval: 3s
      timeout: 3s
      retries: 20

  web:
    build: ./web
    ports:
      - "${WEB_PORT:-3000}:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
